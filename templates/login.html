<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - OKX AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(13, 110, 253, 0.18), transparent 32%),
        radial-gradient(circle at bottom right, rgba(25, 135, 84, 0.16), transparent 30%),
        linear-gradient(135deg, #0f172a 0%, #111827 45%, #172033 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(17, 24, 39, 0.92);
      color: #e5e7eb;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
    }
    .brand-badge {
      width: 56px;
      height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, #2563eb, #10b981);
      color: white;
      font-size: 1.4rem;
    }
    .form-control {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
      color: #f9fafb;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.2);
    }
    .form-control::placeholder {
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card login-card rounded-4">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-badge mb-3"><i class="bi bi-snow"></i></div>
        <h3 class="mb-1">Snowwolf 登录</h3>
        <p class="text-secondary mb-0">仅限 snowwolf 用户访问交易系统</p>
      </div>

      {% if error %}
      <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label">用户名</label>
          <input name="username" class="form-control form-control-lg" placeholder="请输入用户名" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">密码</label>
          <input name="password" type="password" class="form-control form-control-lg" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">
          <i class="bi bi-box-arrow-in-right"></i> 登录系统
        </button>
      </form>
    </div>
  </div>
</body>
</html>
